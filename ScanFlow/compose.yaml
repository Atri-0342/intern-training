services:

  api:
    build: .
    container_name: scanflow

    env_file:
      - .env
      - .env.secret

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic

    restart: unless-stopped

    networks:
      - scanflow-network


  db:
    image: postgres:17
    container_name: scanflow-postgres

    env_file:
      - .env
      - .env.secret

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - scanflow-network


  nginx:
    image: nginx:alpine

    ports:
      - "8000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro

    depends_on:
      - api

    restart: unless-stopped

    networks:
      - scanflow-network


volumes:
  postgres-data:


networks:
  scanflow-network: